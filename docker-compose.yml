services:
  march7thassistant:
    container_name: m7a-enhance
    build: .
    # image: ghcr.io/shingyu/march7thassistant-docker-enhance:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/m7a/webui/data
      - ./logs:/m7a/logs
    environment:
      - TZ=Asia/Shanghai
      - MARCH7TH_LOG_LEVEL=INFO
      # 前端界面风格切换：m3e (默认，Material 3 Expressive) 或 simple (轻量简洁版)
      - WEBUI_THEME=m3e
      # ==========================================================
      # 认证模式一：Token 密钥认证（默认启用，未配置 OIDC 时生效）
      # ==========================================================
      - WEBUI_TOKEN=12345678
      # ==========================================================
      # 认证模式二：OIDC 统一身份认证（支持 PKCE S256）
      # 当同时填入 OIDC_ENDPOINT / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET 时自动切换为 OIDC 模式
      # ==========================================================
      # - OIDC_ENDPOINT=https://auth.example.com/application/o/m7a/
      # - OIDC_CLIENT_ID=your_client_id
      # - OIDC_CLIENT_SECRET=your_client_secret
      # - OIDC_BRAND=SSO
      # - OIDC_ADMIN_USERNAME=admin
    network_mode: "bridge"
    shm_size: 2g
    init: true
    restart: unless-stopped
