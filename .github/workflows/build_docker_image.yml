name: Build & Publish Docker Image Auto

# 触发条件：
# 1. workflow_dispatch: 支持在 GitHub Actions 页面手动触发
# 2. push.tags: 当推送符合 v*.*.* 格式的标签时自动触发（如 v1.0.0）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

# 环境变量：定义 Docker 镜像仓库和镜像名称（使用 -v2 新镜像名，避免自动拉取旧镜像名的原用户升级后因不兼容而运行失败）
env:
  REGISTRY: ghcr.io # 使用 GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}-v2 # 使用新镜像名隔离重构版

jobs:
  build-and-push:
    # 如果是 tag 且 tag 名称包含 'beta'（例如 v1.2.3-beta），则跳过此 job（手动触发除外）
    if: github.event_name == 'workflow_dispatch' || github.ref_type != 'tag' || !contains(github.ref_name, 'beta')
    runs-on: ubuntu-latest
    # 权限设置：需要读取仓库内容和写入 GitHub Packages
    permissions:
      contents: read # 读取仓库代码
      packages: write # 推送镜像到 GitHub Container Registry
    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "false"

      # 步骤 2: 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 3: 登录到容器镜像仓库
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 4: 提取镜像元数据（标签和标注）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=false

      # 步骤 5: 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # 步骤 6: 自动清理旧版本镜像
      - name: Delete old image versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-v2
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'
          ignore-versions: '^(latest|main)$'
