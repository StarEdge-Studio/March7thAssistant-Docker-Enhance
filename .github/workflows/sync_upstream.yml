name: Sync Upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          UPSTREAM_URL="https://github.com/moesnow/March7thAssistant.git"
          UPSTREAM_BRANCH="main"
          git remote add upstream $UPSTREAM_URL
          git fetch upstream $UPSTREAM_BRANCH

      - name: Sync Upstream (Try Merge or Branch)
        id: sync
        run: |
          BRANCH_NAME="upstream-sync-branch"
          echo "正在尝试自动合并上游代码..."
          if git merge upstream/main --no-edit; then
            echo "✅ 自动合并成功，没有任何冲突！"
            git push origin main
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "❌ 发现冲突！"
            git merge --abort
            git push -f origin upstream/main:refs/heads/$BRANCH_NAME
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR on Conflict
        if: steps.sync.outputs.merged == 'false'
        run: |
          BRANCH_NAME="upstream-sync-branch"
          PR_EXISTS=$(gh pr list --repo ${{ github.repository }} --head $BRANCH_NAME --state open --json number --jq '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --repo ${{ github.repository }} \
              --title "⚠️ 发现上游更新，存在代码冲突" \
              --base main \
              --head $BRANCH_NAME \
              --body "### 🔄 自动同步报告
                      检测到上游仓库有新代码，但与本地修改存在冲突，无法自动合并。"
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT }}
